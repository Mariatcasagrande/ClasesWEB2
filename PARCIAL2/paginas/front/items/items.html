<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ítems · Parcial 2</title>
        <link rel="stylesheet" href="/estilos.css" />
    </head>
    <body>
        <nav class="menu">
            <ul>
                <li><a href="/app/items/items.html">Ítems</a></li>
                <li><a href="/app/procedimiento/procedimiento.html">Procedimiento</a></li>
                <li><a href="/cerrar-sesion">Cerrar sesión</a></li>
            </ul>
        </nav>

        <main class="contenedor">
            <h1>Ítems</h1>

            <p id="mensaje" class="mensaje">Cargando...</p>

            <ul id="lista" class="lista"></ul>
        </main>

        <script>
            const lista = document.querySelector('#lista')
            const mensaje = document.querySelector('#mensaje')

            async function cargarItems() {
                const respuesta = await fetch('/api/v1/productos')

                if (respuesta.status === 401) {
                    window.location.href = '/login?error=sinsesion'
                    return
                }

                const datos = await respuesta.json()

                if (!respuesta.ok) {
                    mensaje.textContent = datos.error
                    return
                }

                mensaje.textContent = ''

                for (const producto of datos) {
                    const enlace = document.createElement('a')
                    enlace.href = `/app/item/item.html?id=${producto.id}`
                    enlace.textContent = producto.nombre

                    const detalle = document.createElement('span')
                    detalle.textContent = `${producto.categoria} · $${producto.precio} · stock: ${producto.stock}`

                    const item = document.createElement('li')
                    item.append(enlace, detalle)
                    lista.append(item)
                }
            }

            cargarItems()
        </script>
    </body>
</html>
