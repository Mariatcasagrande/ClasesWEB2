<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Detalle del ítem · Parcial 2</title>
        <link rel="stylesheet" href="/estilos.css" />
    </head>
    <body>
        <nav class="menu">
            <ul>
                <li><a href="/app/items/items.html">Ítems</a></li>
                <li><a href="/app/procedimiento/procedimiento.html">Procedimiento</a></li>
                <li><a href="/cerrar-sesion">Cerrar sesión</a></li>
            </ul>
        </nav>

        <main class="contenedor">
            <p><a href="/app/items/items.html">← Volver al listado</a></p>

            <h1 id="titulo">Detalle del ítem</h1>

            <p id="mensaje" class="mensaje"></p>

            <section class="tarjeta">
                <dl id="detalle" class="detalle"></dl>
            </section>
        </main>

        <script>
            const id = new URLSearchParams(window.location.search).get('id')
            const titulo = document.querySelector('#titulo')
            const detalle = document.querySelector('#detalle')
            const mensaje = document.querySelector('#mensaje')

            async function cargarItem() {
                if (!id) {
                    mensaje.textContent = 'Falta el id en la URL.'
                    return
                }

                const respuesta = await fetch(`/api/v1/productos/${id}`)

                if (respuesta.status === 401) {
                    window.location.href = '/login?error=sinsesion'
                    return
                }

                const datos = await respuesta.json()

                if (!respuesta.ok) {
                    mensaje.textContent = datos.error
                    return
                }

                titulo.textContent = datos.nombre

                const filas = [
                    ['ID', datos.id],
                    ['Nombre', datos.nombre],
                    ['Categoría', datos.categoria],
                    ['Precio', datos.precio],
                    ['Stock', datos.stock],
                ]

                for (const [etiqueta, valor] of filas) {
                    const termino = document.createElement('dt')
                    termino.textContent = etiqueta

                    const definicion = document.createElement('dd')
                    definicion.textContent = valor

                    detalle.append(termino, definicion)
                }
            }

            cargarItem()
        </script>
    </body>
</html>
