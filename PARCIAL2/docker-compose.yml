services:
  bd:
    image: postgres:17
    container_name: parcial2_bd
    environment:
      POSTGRES_USER: ${BD_USER:-postgres}
      POSTGRES_PASSWORD: ${BD_PASS:-postgres}
      POSTGRES_DB: ${BD_BD:-parcial2_aw2}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${BD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/base_datos.sql:/docker-entrypoint-initdb.d/01-base_datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USER:-postgres} -d ${BD_BD:-parcial2_aw2}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
