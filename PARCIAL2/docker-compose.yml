services:
  bd:
    image: postgres:17
    container_name: parcial2_bd
    environment:
      POSTGRES_USER: ${BD_USER:-postgres}
      POSTGRES_PASSWORD: ${BD_PASS:-postgres}
      POSTGRES_DB: ${BD_BD:-parcial2_aw2}
    ports:
      - "${BD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/base_datos.sql:/docker-entrypoint-initdb.d/base_datos.sql:ro

volumes:
  pgdata:
